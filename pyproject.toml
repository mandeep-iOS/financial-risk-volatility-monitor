[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-risk-monitor"
version = "0.1.0"
description = "Educational financial risk and volatility monitor comparing historical variance and GARCH forecasts."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "arch>=7.0,<8.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "matplotlib>=3.9,<4.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "pandas-market-calendars>=4.4,<5.0",
    "pydantic>=2.8,<3.0",
    "scipy>=1.14,<2.0",
    "statsmodels>=0.14,<1.0",
    "streamlit>=1.37,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

